<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .main{
            background-image: url('happybirthday.jpg');
            height: 100vh;
            background-repeat: no-repeat;
            width: 50vw;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .chroma{
            mix-blend-mode: multiply;
        }

        span{
            display: flex;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <div class="main">
        <span>С днём рождения Диана!</span>
        <span>Желаю вам счастья, <br> богатства, здоровья и радости, <br> ну и конечно же быть <br> ТОП 1 МИРА по <br> программированию!</span>
        <img src="hbmarvin.png" class="chroma">
    </div>
</body>
</html>
