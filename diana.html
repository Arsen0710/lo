	<script>
		const owner = document.querySelector('.everyone');
		let timeoutId;

		owner.addEventListener('mousemove', (e) => {
			const rect = owner.getBoundingClientRect();
			const x = e.clientX - rect.left;
			const y = e.clientY - rect.top;

			const centerX = rect.width / 2;
			const centerY = rect.height / 2;

			const rotateX = ((y - centerY) / centerY) * 5;
			const rotateY = ((x - centerX) / centerX) * 5;
			const damping = 0.6;

			owner.style.transform = `perspective(950px) rotateX(${-rotateX}deg) rotateY(${rotateY}deg) scale(1.01)`;
			owner.style.transition = 'transform 0.1s ease-out';

			clearTimeout(timeoutId);
		});

		owner.addEventListener('mouseleave', () => {
			owner.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
			owner.style.transition = 'transform 0.35s ease-in-out';
		});

		let group = document.querySelector('.group');
