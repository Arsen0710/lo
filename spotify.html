<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shefy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gabriela&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');

        * {
            color: #fff;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(5, 6, 7);
        }

        .main {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6.7rem;
        }

        .center {
            display: flex;
            align-items: center;
            width: fit-content;
            border-radius: 24px;
            width: 12rem;
            height: 12rem;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
        }

        .gabriela-regular {
            font-family: "Gabriela", serif;
            font-weight: 400;
            font-style: normal;
            position: absolute;
            top: 11rem;
            user-select: none;
        }

        .autor {
            color: #acacac;
            position: absolute;
            top: 14rem;
        }

        .first-line {
            display: flex;
            gap: 6.7rem;
            align-items: center;
            padding: 1rem;
        }

        .center-left {
            display: flex;
            align-items: center;
            width: fit-content;
            border-radius: 24px;
            width: 12rem;
            height: 12rem;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
        }

        .center-right {
            display: flex;
            align-items: center;
            width: fit-content;
            border-radius: 24px;
            width: 12rem;
            height: 12rem;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
        }

        .left-left-left {
            display: flex;
            align-items: center;
            width: fit-content;
            border-radius: 24px;
            width: 12rem;
            height: 12rem;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
        }

        .center-left-left {
            display: flex;
            align-items: center;
            width: fit-content;
            border-radius: 24px;
            width: 12rem;
            height: 12rem;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
        }

        img {
            width: 8rem;
            border-radius: 12px;
        }

        h2 {
            font-size: 1.25rem;
            margin: 0.5rem 0;
        }

        span {
            font-size: 1rem;
            color: #acacac;
        }

        .second-line {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .third-line {
            display: flex;
            justify-content: center;
            gap: 1rem;
            align-items: center;
        }

        svg {
            width: 3.5rem;
        }

        .one {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #595959;
            border-radius: 50%;
            width: 4rem;
            height: 4rem;
        }

        .rotate {
            rotate: 180deg;
        }

        #gabriela-regular {
            font-family: "Gabriela", serif;
            font-weight: 400;
            font-style: normal;
            top: 13rem;
        }

        #autor {
            top: 16rem;
        }

        .active {
            left: 16rem;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="first-line">
            <div class="left-left-left track">
                <img src="flyingnimbus.png" id="left">
                <h2 class="gabriela-regular">FlyingNimbus</h2>
                <span class="autor">Tyrell Forrest</span>
            </div>
            <div class="center-left-left track">
                <img src="pla.png" id="center-left">
                <h2 class="gabriela-regular">Пыяла</h2>
                <span class="autor">АИГЕЛ</span>
            </div>
            <div class="center-left track">
                <img src="sharady.png" id="center">

            <div class="center track">

    <audio src="sharady.mp3" id="firstid"></audio>

    <script>
        let music = [
            'sharady.mp3',
            'portrety.mp3',
            'falling.mp3',
            'flyingnimbus.mp3',
            'aigel.mp3',
        ]

        let current = 0;



        let tracks = document.querySelectorAll(".track");

        let rotate = document.querySelector(".rotate");
        rotate.addEventListener("click", function () {
            current++;
            if (current > 4) {
                current = 0;
            }
            if (current == 0){
                tracks[0].style.left = "0v";
                tracks[1].style.left = "0vw";
                tracks[2].style.left = "0vw";
                tracks[3].style.left = "0vw";
                tracks[4].style.left = "0vw";
            }

            else if (current == 1) {
                tracks[0].style.left = "0vw";
                tracks[1].style.left = "0vw";
                tracks[2].style.left = "21vw";
                tracks[3].style.left = "-21vw";
                tracks[4].style.left = "0vw";
            }

            else if (current == 2) {
                tracks[0].style.left = "0vw";
                tracks[1].style.left = "0vw";
                tracks[2].style.left = "42vw";
                tracks[3].style.left = "0vw";
                tracks[4].style.left = "-42vw";
            }

            else if (current == 3) {
                tracks[0].style.left = "42vw";
                tracks[1].style.left = "0vw";
                tracks[2].style.left = "-42vw";
                tracks[3].style.left = "0vw";
                tracks[4].style.left = "0vw";
            }

            else if (current == 4) {
                tracks[0].style.left = "0vw";
                tracks[1].style.left = "21vw";
                tracks[2].style.left = "-21vw";
                tracks[3].style.left = "0vw";
                tracks[4].style.left = "0vw";
            }

            let audio = document.getElementById("firstid");

            audio.setAttribute("src", music[current]);
        });

        let pausestop = document.querySelector(".pausestop");
        pausestop.addEventListener("click", function () {
            let audio = document.getElementById("firstid");

            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }

        });

        let unrotate = document.querySelector(".unrotate");
        unrotate.addEventListener("click", function () {
            current--;
            if (current < 0) {
                current = 4;
            }

            if (current == 0){
                tracks[0].style.left = "0v";
                tracks[1].style.left = "0vw";
                tracks[2].style.left = "0vw";
                tracks[3].style.left = "0vw";
                tracks[4].style.left = "0vw";
            }

            else if (current == 1) {
                tracks[0].style.left = "0vw";
                tracks[1].style.left = "0vw";
                tracks[2].style.left = "21vw";
                tracks[3].style.left = "-21vw";
                tracks[4].style.left = "0vw";
            }

            else if (current == 2) {
                tracks[0].style.left = "0vw";
                tracks[1].style.left = "0vw";
                tracks[2].style.left = "42vw";
                tracks[3].style.left = "0vw";
                tracks[4].style.left = "-42vw";
            }

            else if (current == 3) {
                tracks[0].style.left = "42vw";
                tracks[1].style.left = "0vw";
                tracks[2].style.left = "-42vw";
                tracks[3].style.left = "0vw";
                tracks[4].style.left = "0vw";
            }

            else if (current == 4) {
                tracks[0].style.left = "0vw";
                tracks[1].style.left = "21vw";
                tracks[2].style.left = "-21vw";
                tracks[3].style.left = "0vw";
                tracks[4].style.left = "0vw";
            }

            let audio = document.getElementById("firstid");

            audio.setAttribute("src", music[current]);
        });
    </script>
